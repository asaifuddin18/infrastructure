name: Deploy Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]

concurrency:
  group: cdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: arn:aws:iam::664658497880:role/github-deploy-infrastructure

jobs:
  diff:
    name: Diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK diff
        run: npx cdk diff --all --context env=dev 2>&1 | tee /tmp/diff.txt

      - name: Comment diff on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let diff = fs.readFileSync('/tmp/diff.txt', 'utf8');
            const LIMIT = 60000;
            if (diff.length > LIMIT) {
              diff = diff.slice(0, LIMIT) + '\n... truncated, see workflow logs ...';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### CDK diff (dev)\n\n```\n' + diff + '\n```',
            });

  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'prod' }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        run: |
          npx cdk deploy --all \
            --context env=${{ github.event.inputs.environment || 'prod' }} \
            --require-approval never
