name: Deploy Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]

concurrency:
  group: cdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CDK_DEPLOY_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
  CDK_DEPLOY_REGION: ${{ vars.AWS_REGION }}
  VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
  VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
  SIGNUP_ALLOWLIST: ${{ vars.SIGNUP_ALLOWLIST }}
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  # OIDC providers are account-global. Unset resolves to false, meaning import the
  # provider the account already has rather than creating a colliding one.
  CREATE_GITHUB_OIDC_PROVIDER: ${{ vars.CREATE_GITHUB_OIDC_PROVIDER }}
  CREATE_VERCEL_OIDC_PROVIDER: ${{ vars.CREATE_VERCEL_OIDC_PROVIDER }}

jobs:
  diff:
    name: Diff (dev)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK diff
        run: npx cdk diff --context env=dev 2>&1 | tee /tmp/diff.txt

      - name: Comment diff on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let diff = fs.readFileSync('/tmp/diff.txt', 'utf8');
            const LIMIT = 60000;
            if (diff.length > LIMIT) {
              diff = diff.slice(0, LIMIT) + '\n... truncated, see workflow logs ...';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### CDK diff (dev)\n\n```\n' + diff + '\n```',
            });

  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'prod' }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        run: |
          npx cdk deploy --all \
            --context env=${{ github.event.inputs.environment || 'prod' }} \
            --require-approval never
